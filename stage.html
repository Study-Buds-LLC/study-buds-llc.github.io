<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Buds AI Stage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles/minimal.css" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/kid-friendly.css" />
</head>

<body>

<header>
  <h2>🎙️ Study Buds AI Assistant</h2>
</header>

<div class="stage">
  <div class="ai">
    <div class="ai-face">🤖</div>
    <p><b>Study Bot</b></p>
    <div id="log">Click the mic and talk!</div>

    <div class="controls">
      <button onclick="startListening()" title="Talk">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById("log");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

const recognition = new SpeechRecognition();
recognition.lang = "en-US";

recognition.onresult = e => {
  const text = e.results[0][0].transcript;
  log.textContent = "You said: " + text;
  reply(text);
};

function startListening() {
  log.textContent = "Listening... 🎤";
  recognition.start();
}

function reply(text) {
  let response = "Let's study together!";

  if (text.includes("math"))
    response = "Math time! Want addition, fractions, or word problems?";
  else if (text.includes("tired"))
    response = "Take a deep breath. You are doing great.";
  else if (text.includes("hello"))
    response = "Hi User! Ready to study?";
  else if (text.includes("time"))
    response = "Focus for 25 minutes. Pomodoro style!";
  else if (text.includes("music"))
    response = "Music helps focus. Lo-fi is awesome.";

  speak(response);
}

function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 1;
  msg.pitch = 1.4;
  speechSynthesis.speak(msg);
}
</script>

</body>
</html>
