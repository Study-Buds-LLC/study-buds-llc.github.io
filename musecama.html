<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinity Music Player 🌌</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link rel="stylesheet" href="styles/minimal.css" />
</head>
<body><div class="lite-mode-banner">This is Lite Mode. View real one at <a href="https://study-buds-llc.github.io">study-buds-llc.github.io</a></div>

<div class="player">
    <h1>🌌 Infinite Vibe Player</h1>

    <button class="calm" onclick="startMusic('Lo_Fi Beats.mp4', 'calm')">
        🌿 Calm Music
    </button>

    <button class="exciting" onclick="startMusic('Metal Coppers.mp4', 'exciting')">
        ⚡ Exciting
    </button>

    <div class="controls">
        <button class="playPause" id="playPauseBtn" onclick="togglePlay()">▶</button>
        <input type="range" min="0" max="1" step="0.01" value="0.7" onchange="setVolume(this.value)">
    </div>

    <video id="video" playsinline></video>
</div>

<script>
const video = document.getElementById("video");
const playPauseBtn = document.getElementById("playPauseBtn");
let fadeInterval;

function startMusic(file, mood) {
    clearInterval(fadeInterval);

    video.pause();
    video.src = file;
    video.style.display = "block";
    video.volume = 0;
    video.play();

    playPauseBtn.textContent = "⏸";
    playPauseBtn.classList.add("playing");

    fadeInterval = setInterval(() => {
        if (video.volume < 0.7) {
            video.volume += 0.02;
        } else {
            clearInterval(fadeInterval);
        }
    }, 100);

    changeBackground(mood);
}

function togglePlay() {
    if (video.paused) {
        video.play();
        playPauseBtn.textContent = "⏸";
        playPauseBtn.classList.add("playing");
    } else {
        video.pause();
        playPauseBtn.textContent = "▶";
        playPauseBtn.classList.remove("playing");
    }
}

function setVolume(value) {
    video.volume = value;
}

function changeBackground(mood) {
    if (mood === "calm") {
        document.body.style.background =
        "url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee')";
    } else {
        document.body.style.background =
        "url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d')";
    }
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
}
</script>

</body>
</html>
