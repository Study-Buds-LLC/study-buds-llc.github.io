<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login or Register - Study Buds</title>

  <link rel="stylesheet" href="styles/minimal.css" />
</head>

<body><div class="lite-mode-banner">This is Lite Mode. View real one at <a href="https://study-buds-llc.github.io">study-buds-llc.github.io</a></div>

<div id="form-container">
    <img src="lumo.png" alt="Study Buds Logo">
    <h2>Welcome to Study Buds</h2>

    <form action="tools.html">
        <label>Display Name <span>*</span></label>
        <input type="text" placeholder="Lumo" class="name" required>

        <label>Username <span>*</span></label>
        <input type="text" placeholder="lumo-3456" class="user" required>
        <p id="status"></p>

        <label>Email <span>*</span></label>
        <input type="email" placeholder="lumo-3456@gmail.com" class="email" required>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" required id="checkDefault">
            <label class="form-check-label" for="checkDefault">
                I agree to the <a href="tof.html">Terms of Service</a>
            </label>
        </div>

        <a href="tools.html">
            <button type="submit" id="submit">Get Started</button>
        </a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
